<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Asha - Healthcare Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>Welcome to ASHA AI</h1>
            <p>Type your health-related question here ...</p>
        </div>
        <div class="right-section">
            <div id="chat-box"></div>
            <div id="user-input">
                <input type="text" id="message" placeholder="Ask me something about health..." />
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    
    <!-- This script will handle the dynamic layout changes -->
    <script>
        const sendButton = document.getElementById('send-btn');
        const messageInput = document.getElementById('message');
        const container = document.querySelector('.container');
        const leftSection = document.querySelector('.left-section');
    
        sendButton.addEventListener('click', () => {
            const userMessage = messageInput.value.trim();
            
            if (userMessage !== '') {
                // Move the left section and shift the container to the left
                container.classList.add('shift-left');
                leftSection.classList.add('hidden');
                
                // Add the user's message to the chat box
                const chatBox = document.getElementById('chat-box');
                const userMessageDiv = document.createElement('div');
                userMessageDiv.classList.add('message', 'user');
                userMessageDiv.textContent = `You: ${userMessage}`;
                chatBox.appendChild(userMessageDiv);
    
                // Simulate a reply from the bot
                setTimeout(() => {
                    const botMessageDiv = document.createElement('div');
                    botMessageDiv.classList.add('message', 'bot');
                    botMessageDiv.textContent = `Asha: I'm still learning. Please ask something related to health.`;
                    chatBox.appendChild(botMessageDiv);
    
                    // Scroll to the bottom of the chat
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1000);
    
                // Clear the input field
                messageInput.value = '';
            }
        });
    </script>

</body>
</html>
